<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
  <link rel="stylesheet" href="login-form.css">
</head>
<body>

  <div class="image-container">
    <img src="images/image-photo.jpg" alt="Profile photo">
  </div>

  <main>
    <h1>Flat Business Profile Widget</h1>

    <form action="#" method="post">
      <input type="text" name="username" class="username" placeholder="Name">
      <input type="password" name="password" class="password" placeholder="*******">
      <input type="submit" value="Submit">
    </form>
  </main>

  <footer>
    <p>&copy; 2016 Flat Business Profile Widget. All rights reserved</p>
  </footer>

</body>
</html>
