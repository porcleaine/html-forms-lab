<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arranging the Widths</title>
  <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>

  <form action="#" method="post">
    <fieldset>
      <legend>Rent Audi Vehicles</legend>

      <label for="name">Named</label>
      <input type="text" id="name" name="name" value="Enter your name">

      <label for="car">Select</label>
      <select id="car" name="car">
        <option>Audi 80</option>
        <option>Audi A3</option>
        <option>Audi A4</option>
        <option>Audi A6</option>
        <option>Audi Q5</option>
      </select>

      <label>Select</label>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="15"></textarea>
    </fieldset>
  </form>

</body>
</html>
